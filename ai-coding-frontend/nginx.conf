# 主站：前端静态资源 + API 反代
server {
    listen 80 default_server;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # SSE 流式必需
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 生成站点泛子域名：{deployKey}.localhost → 部署产物目录
# 上云时把 localhost 换成你的域名，并加 DNS 泛解析 *.yourdomain.com
server {
    listen 80;
    server_name ~^(?<dkey>[A-Za-z0-9]+)\.localhost$;

    root /srv/deploy/$dkey;
    index index.html;

    # 不能用 /index.html 兜底：内部重定向会丢失 $dkey 捕获变量造成循环
    location / {
        try_files $uri $uri/ =404;
    }
}
